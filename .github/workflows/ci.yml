name: ci

on:
  pull_request:
  push:
    branches: [main, "milestone/**"]

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      # A well-formed public test key so the build can render; not a real instance.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:bundle
      - name: Smoke tests (no Clerk secret, so auth screens show the unconfigured state)
        run: |
          npm start -- -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          TRYBE_TEST_WEB_URL=http://127.0.0.1:3000 npm run test:smoke
