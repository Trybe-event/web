openapi: 3.1.0
info:
  title: Trybe API
  version: 0.1.0
  description: |
    Contract for the Trybe Go API. The browser never calls this service directly:
    the web app's same-origin `/api` proxy forwards allowed paths here.

    `x-account` on every operation states who may call it:
    - `public`: no session required
    - `authenticated`: a valid Clerk session, with or without an account binding
    - `authenticated-bound`: a session bound to any account type
    - `organizer` / `attendee` / `admin`: a session bound to that account type
    - `webhook`: signed provider callback, no session

    Errors always use the `Error` schema. Lists use cursor pagination
    (`cursor`, `limit` in; `next_cursor` out). Create calls that must not
    duplicate accept an `Idempotency-Key` header.
servers:
  - url: http://localhost:8080
    description: Local API
tags:
  - name: system
  - name: accounts
  - name: profiles
  - name: uploads
  - name: events
  - name: program
  - name: registration
  - name: organizer
  - name: discovery
  - name: connections
  - name: safety
  - name: notifications
  - name: messaging
  - name: lifecycle
  - name: admin
  - name: metrics
security:
  - session: []

paths:
  # ------------------------------------------------------------------ system
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness probe
      x-account: public
      x-milestone: M1
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness probe (database reachable)
      x-account: public
      x-milestone: M1
      security: []
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ accounts
  /me/account:
    get:
      tags: [accounts]
      operationId: getMyAccount
      summary: The caller's bound account, or 404 when no account type is bound yet
      x-account: authenticated
      x-milestone: M1
      responses:
        "200":
          description: Bound account
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [accounts]
      operationId: putMyOrganizerAccount
      summary: Replace the organizer's business name and contact name (idempotent). Account type and the private phone are not changed.
      x-account: organizer
      x-milestone: M4
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizerAccountInput" } } }
      responses:
        "200":
          description: Saved account
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /accounts/organizer:
    post:
      tags: [accounts]
      operationId: bindOrganizer
      summary: Bind the caller's Clerk user as an organizer (idempotent; 409 if bound as another type)
      x-account: authenticated
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrganizerSignup" } } }
      responses:
        "200":
          description: Already bound as organizer
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "201":
          description: Bound
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /accounts/attendee:
    post:
      tags: [accounts]
      operationId: bindAttendee
      summary: Bind the caller's Clerk user as an attendee (idempotent; 409 if bound as another type)
      x-account: authenticated
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AttendeeSignup" } } }
      responses:
        "200":
          description: Already bound as attendee
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "201":
          description: Bound
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me:
    delete:
      tags: [accounts]
      operationId: deleteMyAccount
      summary: Delete the caller's account per the retention policy
      x-account: attendee
      x-milestone: M4
      responses:
        "204": { description: Deleted }
  /webhooks/clerk:
    post:
      tags: [accounts]
      operationId: clerkWebhook
      summary: Clerk user lifecycle webhook (svix-signed, deduplicated by event id)
      x-account: webhook
      x-milestone: M1
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "204": { description: Processed or already processed }
        "401": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ profiles
  /me/profile:
    get:
      tags: [profiles]
      operationId: getMyProfile
      summary: The caller's full profile including hidden fields and their visibility
      x-account: attendee
      x-milestone: M1
      responses:
        "200":
          description: Own profile
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnProfile" } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [profiles]
      operationId: putMyProfile
      summary: Create or replace the caller's profile
      x-account: attendee
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnProfile" } } }
        "400": { $ref: "#/components/responses/Error" }
  /me/profile/preview:
    get:
      tags: [profiles]
      operationId: previewMyProfile
      summary: The caller's profile exactly as another viewer type would receive it
      x-account: attendee
      x-milestone: M1
      parameters:
        - name: as
          in: query
          required: true
          schema: { type: string, enum: [event_member, connection] }
      responses:
        "200":
          description: Filtered profile
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
  /me/privacy:
    get:
      tags: [profiles]
      operationId: getMyPrivacy
      x-account: attendee
      x-milestone: M1
      responses:
        "200":
          description: Privacy settings
          content: { application/json: { schema: { $ref: "#/components/schemas/PrivacySettings" } } }
    put:
      tags: [profiles]
      operationId: putMyPrivacy
      x-account: attendee
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PrivacySettings" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/PrivacySettings" } } }

  # ------------------------------------------------------------------ uploads
  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Short-lived signed upload URL for an avatar or event image
      x-account: authenticated-bound
      x-milestone: M1
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UploadRequest" } } }
      responses:
        "201":
          description: Signed upload
          content: { application/json: { schema: { $ref: "#/components/schemas/Upload" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ events (organizer)
  /events:
    post:
      tags: [events]
      operationId: createEventDraft
      x-account: organizer
      x-milestone: M2
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "201":
          description: Draft created (or the original draft for a repeated key)
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/Error" }
  /events/{eventId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    delete:
      tags: [events]
      operationId: deleteEventDraft
      summary: Permanently delete an owned draft and its program; published and ended events cannot be deleted
      x-account: organizer
      x-milestone: M2
      responses:
        "204": { description: Draft deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      tags: [events]
      operationId: getEvent
      x-account: organizer
      x-milestone: M2
      responses:
        "200":
          description: Event owned by the caller
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [events]
      operationId: updateEvent
      x-account: organizer
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /events/{eventId}/publish:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    post:
      tags: [events]
      operationId: publishEvent
      x-account: organizer
      x-milestone: M2
      responses:
        "200":
          description: Published (idempotent)
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/Error" }
  /events/{eventId}/status:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    post:
      tags: [events]
      operationId: setEventStatus
      x-account: organizer
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [published, ended] } }
      responses:
        "200":
          description: Status changed
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "409": { $ref: "#/components/responses/Error" }
  /events/{eventId}/networking:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    put:
      tags: [lifecycle]
      operationId: setNetworkingWindow
      x-account: organizer
      x-milestone: M4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opens_at, closes_at]
              properties:
                opens_at: { type: string, format: date-time }
                closes_at: { type: string, format: date-time }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } }
        "400": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ program
  /events/{eventId}/program:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [program]
      operationId: getProgram
      x-account: organizer
      x-milestone: M2
      responses:
        "200":
          description: Program days with sessions
          content: { application/json: { schema: { $ref: "#/components/schemas/Program" } } }
  /events/{eventId}/program/days:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    post:
      tags: [program]
      operationId: createProgramDay
      x-account: organizer
      x-milestone: M2
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Keep the same key and body when retrying a create after a lost response
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgramDayInput" } } }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgramDay" } } }
        "400": { $ref: "#/components/responses/Error" }
  /events/{eventId}/program/days/{dayId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/DayId" }]
    patch:
      tags: [program]
      operationId: updateProgramDay
      x-account: organizer
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgramDayInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgramDay" } } }
    delete:
      tags: [program]
      operationId: deleteProgramDay
      x-account: organizer
      x-milestone: M2
      responses:
        "204": { description: Deleted }
  /events/{eventId}/program/days/{dayId}/sessions:
    parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/DayId" }]
    post:
      tags: [program]
      operationId: createSession
      x-account: organizer
      x-milestone: M2
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Keep the same key and body when retrying a create after a lost response
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SessionInput" } } }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Error" }
  /events/{eventId}/program/sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/SessionId" }]
    patch:
      tags: [program]
      operationId: updateSession
      x-account: organizer
      x-milestone: M2
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SessionInput" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [program]
      operationId: deleteSession
      x-account: organizer
      x-milestone: M2
      responses:
        "204": { description: Deleted }
  /events/{eventId}/program/order:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    put:
      tags: [program]
      operationId: reorderProgram
      summary: Atomically set the order of days and of sessions within each day
      x-account: organizer
      x-milestone: M2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: array
                  items:
                    type: object
                    required: [id, session_ids]
                    properties:
                      id: { type: string, format: uuid }
                      session_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: New program order
          content: { application/json: { schema: { $ref: "#/components/schemas/Program" } } }

  # ------------------------------------------------------------------ organizer dashboard
  /organizer/events:
    get:
      tags: [organizer]
      operationId: listOrganizerEvents
      x-account: organizer
      x-milestone: M2
      responses:
        "200":
          description: The caller's events with registration totals
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/OrganizerEventSummary" } }
  /organizer/events/{eventId}/registrations/trend:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [organizer]
      operationId: getRegistrationTrend
      x-account: organizer
      x-milestone: M2
      responses:
        "200":
          description: Daily registration counts in the event timezone
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      required: [date, registrations]
                      properties:
                        date: { type: string, format: date }
                        registrations: { type: integer }

  # ------------------------------------------------------------------ registration (public + attendee)
  /e/{slug}:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      tags: [registration]
      operationId: getPublicEvent
      summary: Landing data for a published event. Drafts and unknown slugs return the same 404.
      x-account: public
      x-milestone: M2
      security: []
      responses:
        "200":
          description: Public event
          content: { application/json: { schema: { $ref: "#/components/schemas/PublicEvent" } } }
        "404": { $ref: "#/components/responses/Error" }
  /e/{slug}/join-preview:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    get:
      tags: [registration]
      operationId: getJoinPreview
      x-account: attendee
      x-milestone: M2
      responses:
        "200":
          description: Caller's saved profile and how event members will see it
          content:
            application/json:
              schema:
                type: object
                required: [profile, as_event_member, already_member]
                properties:
                  profile: { $ref: "#/components/schemas/OwnProfile" }
                  as_event_member: { $ref: "#/components/schemas/Profile" }
                  already_member: { type: boolean }
  /e/{slug}/join:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      tags: [registration]
      operationId: joinEvent
      summary: Explicitly join an event (idempotent)
      x-account: attendee
      x-milestone: M2
      responses:
        "200":
          description: Membership
          content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } }
        "409": { $ref: "#/components/responses/Error" }
  /e/{slug}/leave:
    parameters: [{ $ref: "#/components/parameters/Slug" }]
    post:
      tags: [registration]
      operationId: leaveEvent
      x-account: attendee
      x-milestone: M2
      responses:
        "204": { description: Left }
  /me/events:
    get:
      tags: [registration]
      operationId: listMyEvents
      x-account: attendee
      x-milestone: M2
      responses:
        "200":
          description: Active memberships for the event switcher
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MyEvent" } }

  # ------------------------------------------------------------------ discovery
  /events/{eventId}/attendees:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [discovery]
      operationId: listAttendees
      summary: Event directory (active members only), permission-filtered
      x-account: attendee
      x-milestone: M3
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: skill, in: query, schema: { type: array, items: { type: string } } }
        - { name: interest, in: query, schema: { type: array, items: { type: string } } }
        - { name: goal, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Page of profiles
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePage" } } }
        "403": { $ref: "#/components/responses/Error" }
  /events/{eventId}/attendees/{attendeeId}:
    parameters: [{ $ref: "#/components/parameters/EventId" }, { $ref: "#/components/parameters/AttendeeId" }]
    get:
      tags: [discovery]
      operationId: getAttendeeProfile
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: Permission-filtered profile with relationship state
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
        "404": { $ref: "#/components/responses/Error" }
  /events/{eventId}/matches:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [discovery]
      operationId: listMatches
      summary: Deterministic relevance ranking with explanations from visible attributes
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [profile, score, reasons]
                      properties:
                        profile: { $ref: "#/components/schemas/Profile" }
                        score: { type: number }
                        reasons: { type: array, items: { type: string } }
        "409":
          description: Networking isn't open (code networking_not_open or networking_closed)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ------------------------------------------------------------------ connections
  /connection-requests:
    post:
      tags: [connections]
      operationId: sendConnectionRequest
      x-account: attendee
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, recipient_id]
              properties:
                event_id: { type: string, format: uuid }
                recipient_id: { type: string, format: uuid }
                message: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Pending request
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionRequest" } } }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/connection-requests:
    get:
      tags: [connections]
      operationId: listMyConnectionRequests
      x-account: attendee
      x-milestone: M3
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ConnectionRequest" } }
  /connection-requests/{requestId}/{action}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [accept, reject, cancel] } }
    post:
      tags: [connections]
      operationId: actOnConnectionRequest
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: Final request state
          content: { application/json: { schema: { $ref: "#/components/schemas/ConnectionRequest" } } }
        "409": { $ref: "#/components/responses/Error" }
  /me/connections:
    get:
      tags: [connections]
      operationId: listMyConnections
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: Accepted connections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Connection" } }
  /connections/{connectionId}:
    parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
    delete:
      tags: [connections]
      operationId: disconnect
      x-account: attendee
      x-milestone: M3
      responses:
        "204": { description: Disconnected }

  # ------------------------------------------------------------------ safety
  /blocks:
    post:
      tags: [safety]
      operationId: blockAttendee
      x-account: attendee
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendee_id]
              properties: { attendee_id: { type: string, format: uuid } }
      responses:
        "204": { description: Blocked }
  /blocks/{attendeeId}:
    parameters: [{ $ref: "#/components/parameters/AttendeeId" }]
    delete:
      tags: [safety]
      operationId: unblockAttendee
      x-account: attendee
      x-milestone: M3
      responses:
        "204": { description: Unblocked }
  /reports:
    post:
      tags: [safety]
      operationId: createReport
      x-account: attendee
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, target_id, reason]
              properties:
                target_type: { type: string, enum: [profile, conversation] }
                target_id: { type: string, format: uuid }
                reason: { type: string, enum: [spam, harassment, impersonation, inappropriate, other] }
                details: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Report received }
  /admin/reports:
    get:
      tags: [admin]
      operationId: listReports
      x-account: admin
      x-milestone: M3
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: Report queue
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Report" } }
                  next_cursor: { type: [string, "null"] }
  /admin/reports/{reportId}:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    get:
      tags: [admin]
      operationId: getReport
      x-account: admin
      x-milestone: M3
      responses:
        "200":
          description: Report detail
          content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } }
  /admin/reports/{reportId}/actions:
    parameters: [{ $ref: "#/components/parameters/ReportId" }]
    post:
      tags: [admin]
      operationId: actOnReport
      x-account: admin
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [dismiss, warn, remove_membership, suspend] }
                reason: { type: string }
      responses:
        "200":
          description: Updated report
          content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } }

  # ------------------------------------------------------------------ notifications
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      x-account: attendee
      x-milestone: M3
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer }
                  next_cursor: { type: [string, "null"] }
  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      x-account: attendee
      x-milestone: M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean }
      responses:
        "204": { description: Marked }
  /notifications/stream:
    get:
      tags: [notifications]
      operationId: streamNotifications
      summary: Server-sent events; resume with Last-Event-ID
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: text/event-stream of Notification objects
          content: { text/event-stream: { schema: { type: string } } }
  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      x-account: attendee
      x-milestone: M3
      responses:
        "200":
          description: Preferences
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }
    put:
      tags: [notifications]
      operationId: putNotificationPreferences
      x-account: attendee
      x-milestone: M3
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }

  # ------------------------------------------------------------------ messaging
  /connections/{connectionId}/conversation:
    parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
    post:
      tags: [messaging]
      operationId: openConversation
      summary: Get or create the conversation for an accepted connection
      x-account: attendee
      x-milestone: M4
      responses:
        "200":
          description: Conversation
          content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } }
        "403": { $ref: "#/components/responses/Error" }
  /conversations:
    get:
      tags: [messaging]
      operationId: listConversations
      x-account: attendee
      x-milestone: M4
      responses:
        "200":
          description: Inbox
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
  /conversations/{conversationId}/messages:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    get:
      tags: [messaging]
      operationId: listMessages
      x-account: attendee
      x-milestone: M4
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  next_cursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [messaging]
      operationId: sendMessage
      x-account: attendee
      x-milestone: M4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties: { body: { type: string, minLength: 1, maxLength: 4000 } }
      responses:
        "201":
          description: Sent
          content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } }
        "403": { $ref: "#/components/responses/Error" }
  /conversations/{conversationId}/read:
    parameters: [{ $ref: "#/components/parameters/ConversationId" }]
    post:
      tags: [messaging]
      operationId: markConversationRead
      x-account: attendee
      x-milestone: M4
      responses:
        "204": { description: Marked }
  /me/unread:
    get:
      tags: [messaging]
      operationId: getUnreadTotals
      x-account: attendee
      x-milestone: M4
      responses:
        "200":
          description: Unread totals
          content:
            application/json:
              schema:
                type: object
                required: [messages, notifications]
                properties:
                  messages: { type: integer }
                  notifications: { type: integer }
  /ws/tickets:
    post:
      tags: [messaging]
      operationId: createSocketTicket
      summary: Single-use ticket for opening the chat socket
      description: |
        Browsers can't send the session on a WebSocket, and the web proxy can't carry an
        upgrade, so the browser opens the socket on the API directly with a ticket from here
        (requested through the proxy like any other call). A ticket works once, within 60 s.
      x-account: attendee
      x-milestone: M4
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }
  /ws:
    get:
      tags: [messaging]
      operationId: chatSocket
      summary: WebSocket upgrade for live chat; authorized on connect and on every action
      description: |
        Opened directly on the API (not through the web proxy) with a ticket from
        POST /ws/tickets, from the web app's origin only. Frames are JSON; see docs/messaging.md.
      x-account: public
      x-milestone: M4
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "101": { description: Switching protocols }
        "200": { description: Not used; the endpoint always upgrades }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ lifecycle
  /events/{eventId}/archive:
    parameters: [{ $ref: "#/components/parameters/EventId" }]
    get:
      tags: [lifecycle]
      operationId: getEventArchive
      summary: Program and permitted attendee list after networking closes
      x-account: attendee
      x-milestone: M4
      responses:
        "200":
          description: Archive
          content:
            application/json:
              schema:
                type: object
                required: [event, program, attendees]
                properties:
                  event: { $ref: "#/components/schemas/PublicEvent" }
                  program: { $ref: "#/components/schemas/Program" }
                  attendees: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: Networking hasn't closed yet (code archive_not_ready)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ------------------------------------------------------------------ metrics
  /feedback:
    post:
      tags: [metrics]
      operationId: submitFeedback
      x-account: attendee
      x-milestone: M4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, relevance]
              properties:
                event_id: { type: string, format: uuid }
                relevance: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Recorded }
  /admin/metrics:
    get:
      tags: [admin]
      operationId: getPilotMetrics
      x-account: admin
      x-milestone: M4
      parameters:
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Aggregate pilot metrics (no contact values)
          content: { application/json: { schema: { type: object, additionalProperties: { type: number } } } }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Clerk session token, forwarded by the web proxy.

  parameters:
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    DayId: { name: dayId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    AttendeeId: { name: attendeeId, in: path, required: true, schema: { type: string, format: uuid } }
    ConnectionId: { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    Slug: { name: slug, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{3,80}$" } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Status:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties: { status: { type: string } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine code, e.g. unauthenticated, forbidden, not_found, invalid, conflict, account_type_conflict, registration_closed, not_member, blocked, networking_closed, rate_limited
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Field name to message, for validation errors

    AccountType: { type: string, enum: [organizer, attendee, admin] }
    Account:
      type: object
      required: [id, type, full_name, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AccountType" }
        full_name: { type: string }
        organization: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    OrganizerSignup:
      type: object
      required: [full_name, organization]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        organization: { type: string, minLength: 1, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 16, pattern: '^\+[1-9][0-9]{7,14}$', description: Optional private business contact in E.164 format. Omitted from account and public event responses. }
    OrganizerAccountInput:
      type: object
      required: [full_name, organization]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        organization: { type: string, minLength: 1, maxLength: 160 }
    AttendeeSignup:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: [string, "null"], maxLength: 32, description: Optional and private. Never shared automatically. }

    Visibility:
      type: string
      enum: [hidden, connections, event_members]
      description: hidden = owner only; connections = accepted connections; event_members = attendees sharing an event with the owner
    LinkKind: { type: string, enum: [linkedin, portfolio, x, instagram, whatsapp, email, phone, other] }
    ProfileLinkInput:
      type: object
      required: [kind, value, visibility]
      properties:
        kind: { $ref: "#/components/schemas/LinkKind" }
        value: { type: string, maxLength: 300 }
        visibility: { $ref: "#/components/schemas/Visibility" }
    ProfileInput:
      type: object
      required: [full_name, role, bio, skills, interests]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 1000 }
        organization: { type: [string, "null"], maxLength: 160 }
        goals: { type: [string, "null"], maxLength: 500 }
        photo_key: { type: [string, "null"] }
        skills: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        interests: { type: array, maxItems: 20, items: { type: string, maxLength: 40 } }
        links: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/ProfileLinkInput" } }
    OwnProfile:
      description: The owner's view, including hidden fields and each link's visibility.
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [attendee_id, links, skills, interests, updated_at]
          properties:
            attendee_id: { type: string, format: uuid }
            skills: { type: array, items: { type: string } }
            interests: { type: array, items: { type: string } }
            links: { type: array, items: { $ref: "#/components/schemas/ProfileLinkInput" } }
            photo_url: { type: [string, "null"] }
            updated_at: { type: string, format: date-time }
    Profile:
      description: |
        A profile as another viewer receives it. Fields the viewer may not see are
        omitted entirely (never sent and hidden in the UI).
      type: object
      required: [attendee_id, full_name]
      properties:
        attendee_id: { type: string, format: uuid }
        full_name: { type: string }
        role: { type: string }
        bio: { type: string }
        organization: { type: string }
        goals: { type: string }
        photo_url: { type: string }
        skills: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
        links:
          type: array
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { $ref: "#/components/schemas/LinkKind" }
              value: { type: string }
        accepting_requests: { type: boolean }
        relationship:
          type: string
          enum: [none, pending_outgoing, pending_incoming, connected, self]
    ProfilePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Profile" } }
        next_cursor: { type: [string, "null"] }
    PrivacySettings:
      type: object
      required: [accepting_requests, ai_matching_opt_out]
      properties:
        accepting_requests: { type: boolean, default: true }
        ai_matching_opt_out: { type: boolean, default: false }

    UploadRequest:
      type: object
      required: [purpose, content_type, size]
      properties:
        purpose: { type: string, enum: [avatar, event_image] }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
    Upload:
      type: object
      required: [key, upload_url, expires_at]
      properties:
        key: { type: string }
        upload_url: { type: string }
        expires_at: { type: string, format: date-time }

    EventFormat: { type: string, enum: [physical, virtual, hybrid] }
    EventStatus: { type: string, enum: [draft, published, ended] }
    EventInput:
      type: object
      description: All fields optional while drafting; publish validates completeness.
      properties:
        name: { type: string, maxLength: 160 }
        format: { $ref: "#/components/schemas/EventFormat" }
        timezone: { type: string, description: "IANA name, e.g. Africa/Lagos" }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        venue_name: { type: [string, "null"] }
        venue_address: { type: [string, "null"] }
        attendance_url: { type: [string, "null"], description: External link for virtual and hybrid events }
        summary: { type: string, maxLength: 280 }
        description: { type: string, maxLength: 10000 }
        topics: { type: array, items: { type: string } }
        image_key: { type: [string, "null"] }
        visibility: { type: string, enum: [public, private] }
        registration_opens_at: { type: [string, "null"], format: date-time }
        registration_closes_at: { type: [string, "null"], format: date-time }
        networking_opens_at: { type: [string, "null"], format: date-time }
        networking_closes_at: { type: [string, "null"], format: date-time }
    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/EventStatus" }
            slug: { type: [string, "null"], description: Set once on publish and never changed }
            registration_url: { type: [string, "null"] }
            image_url: { type: [string, "null"] }
            registration_state: { $ref: "#/components/schemas/WindowState" }
            networking_state: { $ref: "#/components/schemas/WindowState" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    WindowState: { type: string, enum: [not_open, open, closed] }
    PublicEvent:
      type: object
      required: [id, slug, name, format, timezone, starts_at, ends_at, registration_state, networking_state, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        organizer_name: { type: string, description: Public host organization name; no personal account fields }
        registration_closes_at: { type: [string, "null"], format: date-time }
        format: { $ref: "#/components/schemas/EventFormat" }
        timezone: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        venue_name: { type: [string, "null"] }
        venue_address: { type: [string, "null"] }
        attendance_url: { type: [string, "null"] }
        summary: { type: string }
        description: { type: string }
        topics: { type: array, items: { type: string } }
        image_url: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EventStatus" }
        registration_state: { $ref: "#/components/schemas/WindowState" }
        networking_state: { $ref: "#/components/schemas/WindowState" }
        program: { $ref: "#/components/schemas/Program" }
    OrganizerEventSummary:
      type: object
      required: [id, name, status, registrations]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: [string, "null"] }
        image_url: { type: [string, "null"], description: Short-lived view URL for the event cover }
        status: { $ref: "#/components/schemas/EventStatus" }
        starts_at: { type: [string, "null"], format: date-time }
        registrations: { type: integer }
        registration_state: { $ref: "#/components/schemas/WindowState" }
        networking_state: { $ref: "#/components/schemas/WindowState" }

    Speaker:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        role: { type: [string, "null"] }
        organization: { type: [string, "null"] }
        bio: { type: [string, "null"] }
    SessionInput:
      type: object
      required: [title, starts_at, ends_at]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        room: { type: [string, "null"] }
        track: { type: [string, "null"] }
        speakers: { type: array, items: { $ref: "#/components/schemas/Speaker" } }
    Session:
      allOf:
        - $ref: "#/components/schemas/SessionInput"
        - type: object
          required: [id, day_id, position, overlaps_with]
          properties:
            id: { type: string, format: uuid }
            day_id: { type: string, format: uuid }
            position: { type: integer }
            overlaps_with: { type: array, items: { type: string, format: uuid } }
    ProgramDayInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        title: { type: [string, "null"] }
    ProgramDay:
      allOf:
        - $ref: "#/components/schemas/ProgramDayInput"
        - type: object
          required: [id, position, sessions]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer }
            sessions: { type: array, items: { $ref: "#/components/schemas/Session" } }
    Program:
      type: object
      required: [days]
      properties:
        days: { type: array, items: { $ref: "#/components/schemas/ProgramDay" } }

    Membership:
      type: object
      required: [event_id, status, joined_at]
      properties:
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [active, left, removed] }
        joined_at: { type: string, format: date-time }
    MyEvent:
      type: object
      required: [event, membership]
      properties:
        event: { $ref: "#/components/schemas/PublicEvent" }
        membership: { $ref: "#/components/schemas/Membership" }

    ConnectionRequest:
      type: object
      required: [id, event_id, status, created_at, other]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, cancelled, expired] }
        message: { type: [string, "null"] }
        direction: { type: string, enum: [incoming, outgoing] }
        other: { $ref: "#/components/schemas/Profile" }
        created_at: { type: string, format: date-time }
    Connection:
      type: object
      required: [id, origin_event_id, connected_at, other]
      properties:
        id: { type: string, format: uuid }
        origin_event_id: { type: string, format: uuid }
        connected_at: { type: string, format: date-time }
        other: { $ref: "#/components/schemas/Profile" }

    Report:
      type: object
      required: [id, target_type, target_id, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        reason: { type: string }
        details: { type: [string, "null"] }
        status: { type: string, enum: [open, actioned, dismissed] }
        created_at: { type: string, format: date-time }

    NotificationKind:
      type: string
      enum: [connection_request, connection_accepted, message, organizer_update]
    Notification:
      type: object
      required: [id, kind, created_at, read]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        event_id: { type: [string, "null"], format: uuid }
        subject_id: { type: [string, "null"], format: uuid, description: "Request, connection or conversation id" }
        actor: { $ref: "#/components/schemas/Profile" }
        text: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      required: [connection_request, connection_accepted, message, organizer_update]
      properties:
        connection_request: { type: boolean }
        connection_accepted: { type: boolean }
        message: { type: boolean }
        organizer_update: { type: boolean }

    Conversation:
      type: object
      required: [id, connection_id, other, unread, can_send]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        other: { $ref: "#/components/schemas/Profile" }
        last_message: { $ref: "#/components/schemas/Message" }
        unread: { type: integer }
        can_send: { type: boolean, description: False after disconnect or block }
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        body: { type: string }
        created_at: { type: string, format: date-time }
